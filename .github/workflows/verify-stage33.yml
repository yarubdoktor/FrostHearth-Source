name: Verify Stage 33 Completeness

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out unpacked repository
        uses: actions/checkout@v4

      - name: Download and extract original stage 33 archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://raw.githubusercontent.com/yarubdoktor/Yarub/main/frost_city_godot_stage33.zip" -o /tmp/stage33.zip
          mkdir -p /tmp/archive
          unzip -q /tmp/stage33.zip -d /tmp/archive
          shopt -s dotglob
          entries=(/tmp/archive/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}" /tmp/stage33-source
          else
            mv /tmp/archive /tmp/stage33-source
          fi

      - name: Compare every source file with repository copy
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import sys

          source = "/tmp/stage33-source"
          dest = os.getcwd()
          missing, mismatched = [], []
          count, total = 0, 0

          for root, dirs, files in os.walk(source):
              for name in files:
                  src = os.path.join(root, name)
                  rel = os.path.relpath(src, source)
                  dst = os.path.join(dest, rel)
                  count += 1
                  size = os.path.getsize(src)
                  total += size
                  if not os.path.isfile(dst):
                      missing.append(rel)
                      continue
                  def digest(path):
                      h = hashlib.sha256()
                      with open(path, "rb") as f:
                          for block in iter(lambda: f.read(1024 * 1024), b""):
                              h.update(block)
                      return h.digest()
                  if digest(src) != digest(dst):
                      mismatched.append(rel)

          print(f"Source archive files: {count}")
          print(f"Uncompressed source bytes: {total}")
          print(f"Missing files in repository: {len(missing)}")
          print(f"Files with different content: {len(mismatched)}")
          if missing:
              print("Missing examples:", missing[:30])
          if mismatched:
              print("Mismatch examples:", mismatched[:30])
          if missing or mismatched:
              sys.exit(1)
          print("PASS: every file from stage 33 exists in the repository with identical content.")
          PY